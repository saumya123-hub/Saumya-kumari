<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="navbar">
                <div class="nav-logo border">
                    <div class="logo"> </div>
                </div>
                <div class="plus">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div class="heart">
                    <i class="fa-regular fa-heart"></i>
                </div>
                <div class="messanger"><i class="fa-brands fa-facebook-messenger"></i>
                </div>
            </div>
            <div class="circles">
                <div class="circle1"></div>
                <div class="circle2"></div>
                <div class="circle3"></div>
                <div class="circle4"></div>
                <div class="circle5"></div>
            </div>

            <p class="Story">Story</p>
            <p class="aish">Aish</p>
            <p class="sand">Sand</p>
            <p class="aakash">Aakash</p>
            <p class="priya">Priya</p>
            <br><br>
            <hr style="border: 1px solid  lightblue;">
            <div class="re">
                <div class="profile"></div>
                <p class="ankita">Ankita_ku102</p>
                <div class="dot">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>
            <div class="image">
                <img src="1168577 (1).jpg" width="400px" height="100px">
            </div>
            <div class="post">
                <div class="like">
                    <i class="fa-solid fa-heart" style="color: red;"></i>
                </div>

                <div class="comment">
                    <i class="fa-solid fa-comment"></i>
                </div>

                <div class="share">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>

                <div class="save">
                    <i class="fa-solid fa-bookmark"></i>
                </div>
            </div>
            <p>Liked by <b>Saloni_gupta</b> and <b>Other</b></p>
            <h6>Sept 8</h6>
            <br>
            <hr style="border: 1px solid lightblue;">
            <footer>
                <div class="add_logo">
                    <div class="home"><i class="fa-solid fa-house"></i>
                    </div>
                    <div class="glass">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div class="square">
                        <i class="fa-solid fa-square-plus"></i>
                    </div>
                    <div class="pic"><i class="fa-solid fa-circle-user"></i>
                    </div>
                </div>
            </footer>
        </div>
    </header>
</body>

</html>
